name: openmanip_x
dof: 4
mass_kg: 0.594
upstream_pkg: open_manipulator_description   # values taken from ROBOTIS-GIT/open_manipulator (Apache-2.0); not needed at runtime
mount_frame: x500/base_link
mount_xyz: [0.0, 0.0, -0.05]
mount_rpy: [3.14159, 0.0, 0.0]
base_link: openmanip_x_link1
ee_link: end_effector_link
joints:
  - joint1
  - joint2
  - joint3
  - joint4
default_controller: joint_trajectory_controller
moveit: true
sims:
  gazebo: true
  webots: false
  mujoco: false
  isaac: false
  pybullet: false
  genesis: false
notes: |
  Upstream ROBOTIS kinematics, masses, inertias and joint limits, with box
  geometry instead of the STL meshes; no runtime dependency on the ROBOTIS
  packages. Spawns folded in the stow pose (ros2_control initial_value):
  straight down the arm would reach past the x500 landing gear. The two
  gripper fingers are not modelled (their 2 g are folded into link5).
