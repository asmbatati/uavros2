version: 1
kind: uav
name: x500_d435
description: x500 + forward RealSense D435 (RGB-D, topics /d435/*) + downward
  1D LiDAR + gimbal camera. Used by drone_interception_sim's interceptor.
chassis:
  ref: x500
sensors:
  - { name: imu,  ref: imu_default,       mount: base_link }
  - { name: gps,  ref: gps_default,       mount: base_link }
  - { name: baro, ref: barometer_default, mount: base_link }
  - name: d435
    ref: realsense_d435
    mount: base_link
    pose: [0.15, 0.0, 0.25, 0, 0, 1.5707]
  - name: lidar
    ref: lidar_2d
    mount: base_link
    pose: [0.16, 0.0, 0.12, 0, 1.57079633, 0]
  - name: gimbal
    ref: gimbal_small_3d
    mount: base_link
    pose: [0.14, 0, -0.10, 1.57079633, 0, 1.57079633]
px4:
  airframe_id: 4420
  spawn_pose_m: [0.0, 0.0, 0.1, 0, 0, 0]
  hover_thrust: 0.60
