# ament's defaults, plus: double quotes, as the code is written; 120 columns;
# hanging-indent and import-order details left to the author; `type` and `id` are
# field names in the asset schemas and node APIs. Long gz topic strings stay whole.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D401,D404,I100,I202,A002,A003,E125,E127,E128,E131
import-order-style = google
inline-quotes = double
max-line-length = 120
per-file-ignores =
    launch/*:E501
    launch/simulators/*:E501
    uavros2/adaptive_image_stitcher.py:E501
    uavros2/execute_random_trajectories_node.py:E501
    uavros2/tf_relay.py:E501
show-source = true
statistics = true
